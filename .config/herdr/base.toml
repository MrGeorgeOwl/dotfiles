onboarding = false

[terminal]
new_cwd = "follow"

[keys]
prefix = "backtick"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
resize_mode = "prefix+r"
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""

[[keys.command]]
key = "prefix+H"
type = "shell"
command = "\"${HERDR_BIN_PATH:-herdr}\" pane resize --direction left --current"
description = "resize pane left"

[[keys.command]]
key = "prefix+J"
type = "shell"
command = "\"${HERDR_BIN_PATH:-herdr}\" pane resize --direction down --current"
description = "resize pane down"

[[keys.command]]
key = "prefix+K"
type = "shell"
command = "\"${HERDR_BIN_PATH:-herdr}\" pane resize --direction up --current"
description = "resize pane up"

[[keys.command]]
key = "prefix+L"
type = "shell"
command = "\"${HERDR_BIN_PATH:-herdr}\" pane resize --direction right --current"
description = "resize pane right"

[ui]
mouse_capture = true

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = false
