- name: create-gh-pr
  description: Use when the user asks Codex to create, open, draft, or publish a GitHub pull request with gh, especially when the PR body should be reviewed or approved before creation.
  purpose: ''
- name: george-code-review
  description: Review a branch, PR, or diff against George's code review checklist, mostly for Python backend. Use when George asks for a review. Tests are out of scope; use test-sanitization for them.
  purpose: ''
- name: git-commit
  description: Use when user asks to commit changes in git.
  purpose: ''
- name: handoff
  description: End a coding session by writing HANDOFF.md so a new agent can continue with lean context, then stop.
  purpose: ''
- name: herdr
  description: Control Herdr, a terminal multiplexer for coding agents. Use only when the user explicitly mentions Herdr or asks to use Herdr to inspect or control panes, tabs, workspaces, commands, or another agent. Do not use merely because a task could benefit from a background terminal, delegation, or parallel work.
  purpose: ''
- name: merge-base
  description: Merge the latest base into the current branch, resolve conflicts, verify, and push without rebasing.
  purpose: ''
- name: pretty-mermaid
  description: Generate and render Mermaid diagrams for architecture docs, READMEs, PRs, terminals, chats, and CI as themed SVG, PNG, or ASCII/Unicode art. Use this skill whenever the user provides Mermaid code or .mmd files; asks for a flowchart, sequence/state/class diagram, ERD, XY chart, or architecture/workflow/data-model visualization; or wants to beautify, theme, batch-convert, or make a diagram terminal-friendly. Runs locally without a browser or DOM, with 15 built-in themes and custom colors.
  purpose: ''
- name: test-sanitization
  description: Review and simplify tests related to the current branch diff against its base. Group related tests and remove tests with no value.
  purpose: ''
