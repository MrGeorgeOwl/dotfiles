# Shared agent skills. Generated by `.agents/skill-doctor registry`.
# Edit only `status` (active | experimental | deprecated) and `purpose`;
# names and descriptions come from each SKILL.md and are overwritten.
- name: "create-gh-pr"
  description: "Use when the user asks Codex to create, open, draft, or publish a GitHub pull request with gh, especially when the PR body should be reviewed or approved before creation."
  status: "active"
  purpose: "Open a gh PR from the repo's PR template; show title and body for approval first."
- name: "git-commit"
  description: "Use when user asks to commit changes in git."
  status: "active"
  purpose: "`<type>: <msg>` commits with feat/fix/refact/chore/doc/infra, under 120 chars."
- name: "handoff"
  description: "End a coding session by writing HANDOFF.md so a new agent can continue with lean context, then stop."
  status: "active"
  purpose: "Write HANDOFF.md at the repo root so the next session can continue, then stop."
- name: "herdr-worktree"
  description: "Create a Herdr git worktree. Use whenever the user asks to create or start a worktree in Herdr, or to work a Jira ticket in its own Herdr worktree"
  status: "active"
  purpose: "Create or reuse one Herdr worktree named after the Jira key or topic, then stop."
- name: "merge-base"
  description: "Merge the latest base into the current branch, resolve conflicts, verify, and push without rebasing."
  status: "active"
  purpose: "Merge the PR base without rebase or force-push, resolve conflicts, verify, push."
- name: "test-sanitization"
  description: "Review and simplify tests related to the current branch diff against its base. Group related tests and remove tests with no value."
  status: "active"
  purpose: "Remove, merge and group tests touched by the branch diff; no behaviour change."
